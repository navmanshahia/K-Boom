<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K•BOOM Quote</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f1e9;color:#142019;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:7vh auto;padding:24px}.card{background:#fff;border-radius:30px;padding:38px;box-shadow:0 20px 60px #14201914}.brand{letter-spacing:.08em}.ey{font-size:11px;letter-spacing:.18em;color:#718077;margin-top:35px}.total{font-family:Georgia,serif;font-size:56px;margin:8px 0}.meta{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:25px 0}.meta div{background:#f4f1e9;padding:16px;border-radius:16px}button{width:100%;padding:16px;border:0;border-radius:999px;background:#142019;color:#fff;font-weight:700;font-size:15px}.ok{padding:25px 0;font-family:Georgia,serif;font-size:32px}@media(max-width:600px){.meta{grid-template-columns:1fr}.card{padding:25px}.total{font-size:44px}}</style></head><body><div class="wrap"><div class="card"><b class="brand">K•BOOM KLEEN</b><div id="app"><p>Loading your quote…</p></div></div></div><script>const token=new URLSearchParams(location.search).get('token'),app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function load(){let r=await fetch('/.netlify/functions/quotes?token='+encodeURIComponent(token||''));if(!r.ok){app.innerHTML='<p>Quote not found or link is invalid.</p>';return}let q=await r.json();app.innerHTML='<div class="ey">PRIVATE QUOTE • '+esc(q.quoteNo)+'</div><h1>Hello '+esc(q.name)+'.</h1><p>Your K•BOOM cleaning estimate for '+esc(q.area)+'.</p><div class="total">NZ$'+Number(q.estimate||0).toFixed(2)+'</div><small>GST INCLUDED</small><div class="meta"><div><small>FREQUENCY</small><br><b>'+esc(q.frequency||'One-time')+'</b></div><div><small>REQUESTED DATE</small><br><b>'+esc(q.date||'To be arranged')+'</b></div></div>'+(q.status==='accepted'?'<div class="ok">✓ Quote accepted</div>':'<button onclick="acceptQ()">ACCEPT QUOTE</button>')}async function acceptQ(){let r=await fetch('/.netlify/functions/quotes?action=accept',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token})});if(r.ok){app.innerHTML='<div class="ok">✓ Thank you. Your quote has been accepted.</div><p>K•BOOM will contact you to confirm scheduling.</p>'}else alert(await r.text())}load()</script></body></html>
